name: Tests (dco)

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: Tests (dco)
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
          disable-telemetry: true
      - name: Check for Developer Certificate of Origin (DCO) compliance
        uses: KineticCafe/actions-dco@a52e56727ec21d6cdba26513826e1ae4a752d2fc # v3.2.1
